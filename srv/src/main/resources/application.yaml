server:
  # 8080 is taken by the UI5 dev server (start-konstryx.bat / ui5 serve).
  # CAP OData V4 therefore listens on 8090 locally; unchanged in the cloud profile.
  port: 8090

spring:
  config:
    activate:
      on-profile: default
  sql:
    init:
      # Which schema file to run, and whether to run it at all.
      #
      # Spring only initialises an embedded database by default, so a local
      # Postgres would come up with no tables in it and every read would fail
      # on a missing relation. Both are driven from the same two variables as
      # the datasource below, so the schema always matches the database it is
      # run against.
      #
      # The schema drops and recreates on every start. That is the right
      # behaviour for a development database and a deliberate one: the demo
      # dataset is seeded from CSV at boot, and a database that kept yesterday's
      # rows alongside today's would double them. Nothing here should ever run
      # against a database whose contents matter.
      platform: ${KX_DB_PLATFORM:h2}
      mode: ${KX_DB_INIT_MODE:embedded}
  # Which database this runs on locally, and how to reach it.
  #
  # Unset, these defaults give the in-memory H2 the service has always used:
  # no installation, identical on every machine, gone when the process stops.
  # Set them in .env and the same build runs against a local Postgres instead,
  # which is what you want when the question is how the model behaves on a real
  # database rather than how a screen looks.
  #
  # The password is read from the environment and is never written here. .env
  # is gitignored; this file is not.
  #
  # The H2 default carries a name rather than the UUID Spring Boot invents for
  # an anonymous embedded database, so a SQL client has something to ask for
  # that is the same after a restart, and DB_CLOSE_DELAY=-1 keeps it alive as
  # long as the process rather than as long as its first connection.
  datasource:
    url: ${KX_DB_URL:jdbc:h2:mem:konstryx;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${KX_DB_DRIVER:org.h2.Driver}
    username: ${KX_DB_USER:sa}
    password: ${KX_DB_PASSWORD:}
cds:
  data-source:
    auto-config:
      enabled: false
    csv:
      # KONSTRYX ships to multiple clients. db/data holds only content every
      # tenant legitimately receives (code lists); test/data holds the demo
      # threads and is development-only. Both are listed here because
      # initialization-mode defaults to `embedded`, so this applies to the
      # in-memory H2 database and never to a provisioned tenant.
      paths:
        - db/data
        - test/data
      # Seed whatever database this is pointed at, not only an embedded one.
      #
      # The default is `embedded`, which is why a local Postgres came up with
      # the schema in place and not a single row in it. `always` is safe here
      # because the schema above is recreated on the same startup - the rows
      # are loaded into tables that were empty a moment earlier.
      initialization-mode: ${KX_DB_SEED_MODE:embedded}
  # Local development only. Personas mirror the xs-security.json role templates
  # one-for-one; the cloud profile takes its roles from XSUAA instead.
  security:
    mock:
      users:
        # Every role, not just Admin. The two authorization layers are
        # independent: the Admin scope bypasses the data-driven permission
        # model, but it does NOT satisfy a service-level @requires - so an
        # admin holding only [Admin, MasterDataSteward] reads master data
        # fine and gets a flat 403 from ProjectService, BudgetService and
        # WorkflowService. Locally that renders as an app with no data in it,
        # which looks like a seeding failure and is not one.
        - name: admin
          password: admin
          roles: [ Admin, MasterDataSteward, ProjectManager, BudgetController,
                   ResourceCoordinator, SiteEngineer ]
        - name: vikram          # PM — Vikram Rao
          password: vikram
          roles: [ ProjectManager ]
        - name: rohan           # Cost Engineer — Rohan Menon
          password: rohan
          roles: [ BudgetController, ProjectManager ]
        - name: daud            # Site Engineer — Daud Patel
          password: daud
          roles: [ SiteEngineer, ResourceCoordinator ]
        - name: jin             # Material Buyer — Jin Lee
          password: jin
          roles: [ ResourceCoordinator ]
        # Two stewards in different legal entities, to exercise scoped masters
        - name: steward_infc
          password: steward_infc
          roles: [ MasterDataSteward ]
        - name: steward_pmi
          password: steward_pmi
          roles: [ MasterDataSteward ]
        # Local demo only: one session that reaches every screen a persona is
        # meant to. NOT the administration screens — AdminService and
        # AuthorizationService require the Admin role, which is the bootstrap
        # bypass, and handing it here would switch off the persona layer this
        # user exists to demonstrate. Number ranges, exchange rates, companies
        # and the persona catalogue are an administrator's screens and stay so.
        #
        # Data scope still applies — this user is assigned to INFC and PRJ-001,
        # so the authorization and master-scope filtering stay visible.
        - name: demo
          password: demo
          roles: [ MasterDataSteward, ProjectManager, BudgetController,
                   ResourceCoordinator, SiteEngineer ]
---
# Cloud profile — XSUAA security + HANA Cloud
spring:
  config:
    activate:
      on-profile: cloud
cds:
  data-source:
    csv:
      # Explicit belt-and-braces: no CSV fixture may ever reach a client
      # tenant's database, whatever the paths above happen to contain.
      initialization-mode: never
  security:
    authentication:
      mode: model-relaxed

# No cds.remote.services here. This profile used to declare S4, ARIBA and SF
# against destinations, and it stopped the service booting in Cloud Foundry:
# CAP resolves a remote service against a CDS definition imported from the
# API's EDMX, nothing is imported (srv/external/ does not exist — see
# INTEGRATION.md), so startup died with "Cannot find service 'S4'".
#
# Nothing consumed them either. The live S/4 integration is S4Connection,
# which talks to the API over java.net.http and resolves the `ITS_S4`
# destination through the Cloud SDK (falling back to S4_HOST/S4_USER/
# S4_PASSWORD locally, where no destination service is bound). It uses the
# destination SERVICE, not CAP's remote-service layer, so it needs the
# konstryx-destination binding in mta.yaml and nothing here. The block only
# existed under `cloud`, so it could not fail locally and had never run
# anywhere until the first real deployment.
#
# Re-add a service here at the point its EDMX is actually imported and a
# handler actually calls it — not before.
