server:
  # 8080 is taken by the UI5 dev server (start-konstryx.bat / ui5 serve).
  # CAP OData V4 therefore listens on 8090 locally; unchanged in the cloud profile.
  port: 8090

spring:
  config:
    activate:
      on-profile: default
  sql:
    init:
      platform: h2
cds:
  data-source:
    auto-config:
      enabled: false
    csv:
      # KONSTRYX ships to multiple clients. db/data holds only content every
      # tenant legitimately receives (code lists); test/data holds the demo
      # threads and is development-only. Both are listed here because
      # initialization-mode defaults to `embedded`, so this applies to the
      # in-memory H2 database and never to a provisioned tenant.
      paths:
        - db/data
        - test/data
  # Local development only. Personas mirror the xs-security.json role templates
  # one-for-one; the cloud profile takes its roles from XSUAA instead.
  security:
    mock:
      users:
        - name: admin
          password: admin
          roles: [ Admin, MasterDataSteward ]
        - name: vikram          # PM — Vikram Rao
          password: vikram
          roles: [ ProjectManager ]
        - name: rohan           # Cost Engineer — Rohan Menon
          password: rohan
          roles: [ BudgetController, ProjectManager ]
        - name: daud            # Site Engineer — Daud Patel
          password: daud
          roles: [ SiteEngineer, ResourceCoordinator ]
        - name: jin             # Material Buyer — Jin Lee
          password: jin
          roles: [ ResourceCoordinator ]
        # Two stewards in different legal entities, to exercise scoped masters
        - name: steward_infc
          password: steward_infc
          roles: [ MasterDataSteward ]
        - name: steward_pmi
          password: steward_pmi
          roles: [ MasterDataSteward ]
        # Local demo only: one session that can reach every screen. Data scope
        # still applies — this user is assigned to INFC and PRJ-001, so the
        # authorization and master-scope filtering stay visible rather than
        # being bypassed the way the Admin bootstrap role would.
        - name: demo
          password: demo
          roles: [ MasterDataSteward, ProjectManager, BudgetController,
                   ResourceCoordinator, SiteEngineer ]
---
# Cloud profile — XSUAA security + HANA Cloud + remote S/4 destinations
spring:
  config:
    activate:
      on-profile: cloud
cds:
  data-source:
    csv:
      # Explicit belt-and-braces: no CSV fixture may ever reach a client
      # tenant's database, whatever the paths above happen to contain.
      initialization-mode: never
  security:
    authentication:
      mode: model-relaxed
  remote.services:
    - name: "S4"
      destination:
        name: "S4HANA_CLOUD"
    - name: "ARIBA"
      destination:
        name: "ARIBA"
    - name: "SF"
      destination:
        name: "SUCCESSFACTORS"
