<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>PurchaseOrders</title>
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
        }
    </style>
    <!--
        The UI5 runtime comes from SAP's CDN, pinned to the version this app is
        developed against, so local and deployed load identical framework code.
        It was "/resources/sap-ui-core.js", which the local dev server proxies
        from a runtime on the developer's disk - that has no equivalent in
        Cloud Foundry, so the deployed app could never have rendered. Pinned
        rather than floating: an unannounced minor bump should not be able to
        change a running client's UI.
    -->
    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/1.150.0/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{
            "konstryxpo": "./"
        }'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted"
    ></script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div
        data-sap-ui-component
        data-name="konstryxpo"
        data-id="container"
        data-settings='{"id" : "konstryxpo"}'
        data-handle-validation="true"
    ></div>
</body>
</html>
