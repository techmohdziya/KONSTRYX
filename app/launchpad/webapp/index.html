<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KONSTRYX</title>

    <!--
        The site - spaces, pages, sections, tiles and the intents behind them -
        is not written here. It is generated from the app manifests by
        tools/build_launchpad_site.py into appconfig/fioriSandboxConfig.json,
        which the sandbox bootstrap loads by convention, and into
        launchpad-content/CommonDataModel.json, which Work Zone loads. One
        definition, two consumers, so the local launchpad and the deployed one
        cannot drift.

        It has to arrive that way rather than through window["sap-ushell-config"]:
        the bootstrap applies its own default site first and REPLACES whatever
        site the page supplied, then merges the JSON config over the result. A
        site built in this file was therefore dead code, and the phases it
        defined were flattened into the sandbox's own "Sample Space".
    -->
    <script id="sap-ushell-bootstrap"
            src="https://ui5.sap.com/1.150.0/resources/sap/ushell/bootstrap/sandbox2.js"></script>

    <!--
        The UI5 runtime comes from SAP's CDN, pinned to the version this app is
        developed against, so local and deployed load identical framework code.
        It was "/resources/sap-ui-core.js", which the local dev server proxies
        from a runtime on the developer's disk - that has no equivalent in
        Cloud Foundry, so the deployed app could never have rendered. Pinned
        rather than floating: an unannounced minor bump should not be able to
        change a running client's UI.
    -->
    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/1.150.0/resources/sap-ui-core.js"
        data-sap-ui-libs="sap.m, sap.ushell, sap.fe.templates"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="allow"
    ></script>

    <script>
    // The sandbox bootstrap prepares the container but does not draw a shell,
    // so the renderer is created once the core is ready. The method was
    // renamed between UI5 versions; both names are tried rather than pinning
    // this page to one runtime.
    sap.ui.getCore().attachInit(function () {
        sap.ui.require(["sap/ushell/Container"], function (Container) {
            var create = Container.createRendererInternal || Container.createRenderer;
            var result = create.call(Container, undefined, true);
            if (result && typeof result.then === "function") {
                result.then(function (renderer) { renderer.placeAt("content"); });
            } else if (result) {
                result.placeAt("content");
            }
        });
    });
    </script>
</head>
<body class="sapUiBody" id="content"></body>
</html>
