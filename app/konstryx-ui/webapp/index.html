<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>KONSTRYX — Engineering &amp; Construction Operations</title>

	<link rel="icon" href="img/logo.png">

	<!--
		The UI5 runtime comes from SAP's CDN, pinned to the same version the
		app is developed against, so local and deployed load identical
		framework code. It used to be the relative "resources/sap-ui-core.js",
		which serve.py proxied to a runtime on the developer's own disk — that
		has no equivalent in Cloud Foundry and was why the deployed app could
		never have rendered. Pinned rather than floating: an unannounced minor
		bump should not be able to change a running client's UI.
	-->
	<script
		id="sap-ui-bootstrap"
		src="https://ui5.sap.com/1.150.0/resources/sap-ui-core.js"
		data-sap-ui-theme="sap_horizon"
		data-sap-ui-libs="sap.m,sap.f,sap.tnt,sap.uxap,sap.ui.layout"
		data-sap-ui-compat-version="edge"
		data-sap-ui-async="true"
		data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
		data-sap-ui-resource-roots='{"konstryx": "./"}'
		data-sap-ui-frame-options="trusted"
		data-sap-ui-xx-componentPreload="off"
		data-sap-ui-xx-waitfortheme="init">
	</script>
	<link rel="stylesheet" href="css/style.css">
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
	<div
		data-sap-ui-component
		data-name="konstryx"
		data-id="container"
		data-settings='{"id": "konstryx"}'
		data-handle-validation="true"
		style="height:100%">
	</div>
</body>
</html>
