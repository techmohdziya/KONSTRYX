specVersion: "3.0"
metadata:
  name: konstryx
type: application

# The Cloud Foundry build. It is the ordinary ui5.yaml plus one thing: a task
# that zips the build output.
#
# That zip is not optional packaging — it is what the deployment actually
# ships. mbt's content module looks for an artifact named after the module
# (konstryx-ui.zip) inside the build result, and `ui5 build` on its own emits
# a directory and no archive. Without this task mbt found nothing, reported
# "copying konstryx-ui.zip ... ok" anyway, and uploaded an empty payload — the
# HTML5 repository then answered "Could not find applications in the request".
builder:
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateVersionInfo
      configuration:
        # Must match the MTA module name: mbt looks for <module>.zip.
        archiveName: konstryx-ui
        keepResources: true

framework:
  # SAPUI5, not OpenUI5: the app uses sap.ui.export (Spreadsheet) for the
  # Excel download on every list screen, and that library does not exist in
  # OpenUI5.
  name: SAPUI5
  version: "1.150.0"
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: sap.f
    - name: sap.tnt
    - name: sap.uxap
    - name: sap.ui.layout
    - name: sap.ui.table
    - name: sap.ui.export
    - name: sap.ui.unified
    - name: themelib_sap_horizon
