<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>KONSTRYX — Project Controller Overview</title>

	<!--
		The overview page, as cards.

		SAP Fiori elements has an Overview Page template and it is OData V2
		only. This service is V4, so the card framework SAP moved to for V4 -
		sap.ui.integration - is what an overview is built from now: the same
		control Work Zone and My Home render their cards with, each card a
		manifest of its own that names its data and how to draw it.

		Cards fetch from the same origin as this page, which is what makes the
		relative /odata paths work: serve.py proxies them to the CAP service,
		and an approuter does the same in Cloud Foundry.
	-->
	<script
		id="sap-ui-bootstrap"
		src="https://ui5.sap.com/1.150.0/resources/sap-ui-core.js"
		data-sap-ui-theme="sap_horizon"
		data-sap-ui-libs="sap.m,sap.f,sap.ui.integration,sap.viz,sap.ui.layout"
		data-sap-ui-compat-version="edge"
		data-sap-ui-async="true"
		data-sap-ui-frame-options="trusted">
	</script>

	<style>
		html, body { height: 100%; margin: 0; }
		.kxCards  { padding: 0.5rem 1rem 1.5rem 1rem; }
		.kxTiles  { padding: 0 0 0.75rem 0; }
	</style>

	<script>
		sap.ui.getCore().attachInit(function () {
			sap.ui.require([
				"sap/f/GridContainer", "sap/f/GridContainerSettings",
				"sap/f/GridContainerItemLayoutData",
				"sap/f/DynamicPage", "sap/f/DynamicPageTitle", "sap/f/DynamicPageHeader",
				"sap/ui/integration/widgets/Card",
				"sap/m/App", "sap/m/Title", "sap/m/Label", "sap/m/Input",
				"sap/m/Button", "sap/m/Toolbar", "sap/m/ToolbarSpacer", "sap/m/Text",
				"sap/m/SelectDialog", "sap/m/StandardListItem", "sap/m/GenericTile",
				"sap/m/NumericContent", "sap/m/TileContent", "sap/m/HBox",
				"sap/ui/layout/VerticalLayout", "sap/ui/model/json/JSONModel",
				"sap/ui/model/Filter", "sap/ui/model/FilterOperator"
			], function (GridContainer, GridContainerSettings, GridContainerItemLayoutData,
					DynamicPage, DynamicPageTitle, DynamicPageHeader, Card,
					App, Title, Label, Input, Button, Toolbar, ToolbarSpacer, Text,
					SelectDialog, StandardListItem, GenericTile, NumericContent,
					TileContent, HBox, VerticalLayout, JSONModel, Filter, FilterOperator) {

				/*
					Every card takes the same two filters and expresses them in
					its own terms, because the entities behind them name a
					project differently: the overview by code, the insight
					entities by projectCode, the client applications by key.
					Keeping each card's expression beside its manifest is what
					lets one filter bar drive all nine.

					Sized to what each card draws. A KPI tile is a header and
					needs two rows; a chart, a table of five projects and a list
					of six fronts each need six.
				*/
				var aCards = [
					{ m: "cards/kpiContract.json",   rows: 2, cols: 3, f: applyPrefix },
					{ m: "cards/kpiEarned.json",     rows: 2, cols: 3, f: applyPrefix },
					{ m: "cards/kpiSpent.json",      rows: 2, cols: 3, f: applyPrefix },
					{ m: "cards/kpiMargin.json",     rows: 2, cols: 3, f: applyPrefix },
					{ m: "cards/chartEvm.json",      rows: 6, cols: 6, f: applyPrefix },
					{ m: "cards/tableProjects.json", rows: 6, cols: 6, f: ownFilter },
					{ m: "cards/listFronts.json",    rows: 6, cols: 4, f: andClause },
					{ m: "cards/listQuiet.json",     rows: 6, cols: 4, f: andClause },
					{ m: "cards/tableClaims.json",   rows: 6, cols: 4, f: andAssociation }
				];

				function esc(s) { return String(s).replace(/'/g, "''"); }
				var mProjectIds = {};

				/*
					Three shapes, because a filter belongs in a different place
					in each kind of query.

					applyPrefix  a filter on an aggregate goes inside $apply.
					             Appended after it, it would filter the single
					             totalled row instead of the rows being totalled.
					andClause    the card already opens a $filter, so this joins
					             it rather than opening a second one, which is
					             not valid OData.
					ownFilter    the card has none, so this opens one.
				*/
				function terms(p, period) {
					var a = [];
					if (p)      { a.push("projectCode eq '" + esc(p) + "'"); }
					if (period) { a.push("periodName eq '" + esc(period) + "'"); }
					return a;
				}
				function applyPrefix(p, period) {
					var a = terms(p, period);
					return a.length ? "filter(" + a.join(" and ") + ")/" : "";
				}
				function andClause(p, period) {
					var a = terms(p, period);
					return a.length ? " and " + a.join(" and ") : "";
				}
				function ownFilter(p) { return p ? "&$filter=code eq '" + esc(p) + "'" : ""; }
				// By key, not by the association path: filtering a draft-enabled
				// entity across project/code comes back 400, and the key is what
				// the service answers on.
				function andAssociation(p) {
					var id = mProjectIds[p];
					return id ? " and project_ID eq " + id : "";
				}

				// The grid takes as many columns as the window gives it. Pinning
				// it made every card narrower than its own contents and turned
				// the page into a column of cropped boxes.
				var oGrid = new GridContainer({
					snapToRow: true,
					layout:  new GridContainerSettings({ rowSize: "5rem",   columnSize: "5rem",   gap: "0.75rem" }),
					layoutS: new GridContainerSettings({ rowSize: "4.5rem", columnSize: "4.5rem", gap: "0.5rem" })
				});

				var aCardControls = [];
				aCards.forEach(function (c) {
					var oCard = new Card({
						manifest: c.m,
						layoutData: new GridContainerItemLayoutData({ minRows: c.rows, columns: c.cols })
					});
					oCard.data("filterFn", c.f);
					aCardControls.push(oCard);
					oGrid.addItem(oCard);
				});

				// ------------------------------------------- the mini tiles
				/*
					The counts a controller checks before reading anything else:
					how many fronts are late, how many nobody is on, how many
					requests are still open, how many claims are unanswered.

					Tiles rather than another card each, because a single number
					with a label does not need a card's header, footer and
					frame - and four of them read in one glance where four cards
					read as a wall.
				*/
				var oTileModel = new JSONModel({ overdue: 0, quiet: 0, requests: 0, claims: 0 });

				/*
					A tile opens the worklist it counts.

					The state it counted travels as a query parameter, which the
					target's filter bar picks up where the property is one of its
					SelectionFields - work fronts filter on state, so an Overdue
					tile lands on the overdue ones. The project travels the same
					way. Where a target does not take the parameter it is ignored
					and the reader lands on the unfiltered list, which is still
					the list they asked for.

					Intent-based navigation would be the SAP-native route and
					needs a launchpad to resolve the intent; these apps are served
					standalone, so the link is a plain one.
				*/
				function navigateTo(sApp, mParams) {
					var p = Object.keys(mParams || {}).filter(function (k) { return mParams[k]; })
						.map(function (k) { return encodeURIComponent(k) + "=" + encodeURIComponent(mParams[k]); });
					window.open("/" + sApp + "/" + (p.length ? "?" + p.join("&") : ""), "_self");
				}

				function miniTile(sTitle, sPath, sSub, sState, fnPress) {
					return new GenericTile({
						header: sTitle, subheader: sSub, frameType: "OneByOne",
						press: fnPress,
						tileContent: [ new TileContent({
							unit: "", content: new NumericContent({
								value: "{tiles>/" + sPath + "}",
								valueColor: sState, icon: ""
							})
						}) ]
					});
				}

				function currentProjectId() { return mProjectIds[oProject.data("key") || ""] || ""; }

				var oTiles = new HBox({ renderType: "Bare", items: [
					miniTile("Overdue", "overdue", "work fronts", "Error", function () {
						navigateTo("konstryx-workfront", { state: "OVERDUE", project_ID: currentProjectId() });
					}),
					miniTile("Untouched", "quiet", "no day this week", "Critical", function () {
						navigateTo("konstryx-workfront", { state: "QUIET", project_ID: currentProjectId() });
					}),
					miniTile("Open", "requests", "resource requests", "Neutral", function () {
						navigateTo("konstryx-resource-request", {});
					}),
					miniTile("Unanswered", "claims", "client claims", "Neutral", function () {
						navigateTo("konstryx-payment-application", { project_ID: currentProjectId() });
					})
				]});
				oTiles.setModel(oTileModel, "tiles");
				oTiles.addStyleClass("kxTiles");

				function countOf(sUrl) {
					return fetch(sUrl, { credentials: "same-origin" })
						.then(function (r) { return r.json(); })
						.then(function (d) { return (d.value || []).length; })
						.catch(function () { return 0; });
				}

				function refreshTiles(p) {
					var q = p ? " and projectCode eq '" + esc(p) + "'" : "";
					var qc = p ? "&$filter=code eq '" + esc(p) + "'" : "";
					Promise.all([
						countOf("/odata/v4/project/WorkFronts?$filter=state eq 'OVERDUE'" + q),
						countOf("/odata/v4/project/WorkFronts?$filter=state eq 'QUIET'" + q),
						fetch("/odata/v4/project/ProjectOverviews?$select=openRequests" + qc,
							{ credentials: "same-origin" }).then(function (r) { return r.json(); })
							.then(function (d) {
								return (d.value || []).reduce(function (n, x) {
									return n + (x.openRequests || 0); }, 0);
							}).catch(function () { return 0; }),
						countOf("/odata/v4/billing/PaymentApplications?$filter=IsActiveEntity eq true and approvedGross eq null"
							+ (mProjectIds[p] ? " and project_ID eq " + mProjectIds[p] : ""))
					]).then(function (a) {
						oTileModel.setData({ overdue: a[0], quiet: a[1], requests: a[2], claims: a[3] });
					});
				}

				// --------------------------------------------- the filters
				/*
					Value help rather than a dropdown. A dropdown is fine for
					five projects and useless for fifty: the dialog searches,
					and it shows the code beside the name so the one a reader
					knows by either finds it.
				*/
				var oProjectModel = new JSONModel({ rows: [] });
				var oPeriodModel  = new JSONModel({ rows: [] });

				function valueHelp(oInput, oModel, sTitle, sKey, sDesc) {
					var oDialog = new SelectDialog({
						title: sTitle, growing: false, rememberSelections: true,
						search: function (e) { filterList(e); },
						liveChange: function (e) { filterList(e); },
						confirm: function (e) {
							var oItem = e.getParameter("selectedItem");
							oInput.setValue(oItem ? oItem.getDescription() : "");
							oInput.data("key", oItem ? oItem.getTitle() : "");
							apply();
						}
					});
					function filterList(e) {
						var v = e.getParameter("value") || "";
						e.getSource().getBinding("items").filter(v ? new Filter({
							filters: [ new Filter(sKey, FilterOperator.Contains, v),
							           new Filter(sDesc, FilterOperator.Contains, v) ],
							and: false
						}) : []);
					}
					oDialog.setModel(oModel);
					oDialog.bindAggregation("items", {
						path: "/rows",
						template: new StandardListItem({
							title: "{" + sKey + "}", description: "{" + sDesc + "}"
						})
					});
					return oDialog;
				}

				var oProject = new Input({
					width: "18rem", showValueHelp: true, valueHelpOnly: false,
					placeholder: "All projects",
					valueHelpRequest: function () { oProjectVH.open(); },
					change: function (e) { if (!e.getParameter("value")) { oProject.data("key", ""); apply(); } }
				});
				var oPeriod = new Input({
					width: "16rem", showValueHelp: true,
					placeholder: "All periods",
					valueHelpRequest: function () { oPeriodVH.open(); },
					change: function (e) { if (!e.getParameter("value")) { oPeriod.data("key", ""); apply(); } }
				});
				var oProjectVH = valueHelp(oProject, oProjectModel, "Select project", "code", "name");
				var oPeriodVH  = valueHelp(oPeriod,  oPeriodModel,  "Select period",  "periodName", "periodName");

				// Filter values come from the data rather than a list written
				// here, so a project added tomorrow appears without anyone
				// editing this page.
				fetch("/odata/v4/project/ProjectOverviews?$select=project_ID,code,name&$orderby=code",
						{ credentials: "same-origin" })
					.then(function (r) { return r.json(); })
					.then(function (d) {
						(d.value || []).forEach(function (p) { mProjectIds[p.code] = p.project_ID; });
						oProjectModel.setData({ rows: d.value || [] });
						refreshTiles("");
					})
					.catch(function () { /* the bar still works unfiltered */ });

				fetch("/odata/v4/project/PeriodReports?$select=periodName&$orderby=periodName",
						{ credentials: "same-origin" })
					.then(function (r) { return r.json(); })
					.then(function (d) {
						var seen = {}, rows = [];
						(d.value || []).forEach(function (p) {
							if (p.periodName && !seen[p.periodName]) {
								seen[p.periodName] = true; rows.push(p);
							}
						});
						oPeriodModel.setData({ rows: rows });
					})
					.catch(function () { /* as above */ });

				var oApplied = new Text({ text: "No filters active" });

				function apply() {
					var p = oProject.data("key") || "", period = oPeriod.data("key") || "";
					aCardControls.forEach(function (oCard) {
						oCard.setParameters({ flt: oCard.data("filterFn")(p, period) });
					});
					refreshTiles(p);
					var aOn = [p, period].filter(Boolean);
					oApplied.setText(aOn.length === 0 ? "No filters active"
						: aOn.length + " filter" + (aOn.length > 1 ? "s" : "") + " active: " + aOn.join(", "));
				}

				var oFilterBar = new Toolbar({ content: [
					new Label({ text: "Project", labelFor: oProject }), oProject,
					new Label({ text: "Period",  labelFor: oPeriod  }), oPeriod,
					new Button({ text: "Go", type: "Emphasized", press: apply }),
					new Button({ text: "Clear", press: function () {
						oProject.setValue(""); oProject.data("key", "");
						oPeriod.setValue("");  oPeriod.data("key", "");
						apply();
					}}),
					new ToolbarSpacer(),
					oApplied
				]});

				// The heading is given for both header states, so a reader
				// scrolled into the cards with the header collapsed still sees
				// what they are looking at.
				var oPage = new DynamicPage({
					title: new DynamicPageTitle({
						heading:         new Title({ text: "Project Controller Overview", level: "H1" }),
						snappedHeading:  new Title({ text: "Project Controller Overview", level: "H1" }),
						expandedHeading: new Title({ text: "Project Controller Overview", level: "H1" }),
						snappedContent:  [ new Text({ text: "Portfolio across all active projects" }) ],
						expandedContent: [ new Text({ text: "Portfolio across all active projects" }) ]
					}),
					header: new DynamicPageHeader({ pinnable: true, content: [ oFilterBar ] }),
					content: new VerticalLayout({ width: "100%", content: [ oTiles, oGrid ] })
				});
				oPage.addStyleClass("kxCards");

				new App({ pages: [ oPage ] }).placeAt("content");
			});
		});
	</script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content"></body>
</html>
