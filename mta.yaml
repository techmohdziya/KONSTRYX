_schema-version: "3.2"
ID: konstryx
version: 0.1.0
description: "KONSTRYX — SAP BTP extension for Engineering & Construction"

parameters:
  enable-parallel-deployments: true

modules:
  - name: konstryx-srv
    type: java
    path: srv
    parameters:
      buildpack: sap_java_buildpack_jakarta
      memory: 1024M
    properties:
      SPRING_PROFILES_ACTIVE: cloud,prod
      JBP_CONFIG_SAP_MACHINE_JRE: '{ jre: { version: 17.+ } }'
    build-parameters:
      builder: custom
      commands: [ "mvn clean package -DskipTests" ]
      build-result: target/*-exec.jar
    provides:
      # The approuter needs the service's route to forward to it.
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: konstryx-db
      - name: konstryx-auth
      - name: konstryx-destination

  # The SAPUI5 app, built and uploaded to the HTML5 application repository.
  #
  # It is NOT served from the Java runtime. An earlier comment here claimed
  # konstryx-srv "already serves the SAPUI5 app as static content" — it never
  # did: the jar contains no UI at all (jar tf lists only service classes), so
  # the approuter's /konstryx-ui route forwarded to nothing and the deployed
  # app could not render. The repository is the right home for it and is what
  # the launchpad reads when the app is reached by intent.
  - name: konstryx-ui
    type: html5
    path: app/konstryx-ui
    build-parameters:
      builder: custom
      commands:
        - npm ci
        - npx ui5 build --clean-dest --dest dist --config ui5-deploy.yaml
      supported-platforms: []
      build-result: dist

  # Building the app is not the same as shipping it. A type: html5 module only
  # produces the artifact; this content module is what uploads it into the
  # app-host, and without it the deploy creates both repository services and
  # then puts nothing in them — the operation log says as much, "Service keys
  # defined for content deployment: { }", while the app 404s behind the login.
  - name: konstryx-ui-deployer
    type: com.sap.application.content
    path: gen
    requires:
      - name: konstryx-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      # The artifact is named after the MODULE (konstryx-ui.zip), not after its
      # build-result directory. Asking for "dist.zip" matched nothing, and the
      # copy step reported success anyway — so an empty payload was uploaded
      # and the repository answered "Could not find applications in the
      # request". target-path is relative to this module's own path (gen), so
      # the zip lands in gen/resources, which build-result then packages.
      build-result: resources
      requires:
        - name: konstryx-ui
          artifacts:
            - konstryx-ui.zip
          target-path: resources/

  # Entry point for the browser. Handles the XSUAA login, serves the UI out of
  # the HTML5 repository, and forwards the token to the service; nothing
  # reaches the CAP service unauthenticated.
  - name: konstryx-approuter
    type: nodejs
    path: app/router
    parameters:
      memory: 256M
      disk-quota: 512M
    requires:
      - name: konstryx-auth
      - name: konstryx-destination
      - name: konstryx-html5-repo-runtime
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

  - name: konstryx-db-deployer
    type: hdb
    # `cds build --production` writes the HDI artifacts to db/src/gen, not
    # gen/db — the latter is the Node.js layout and does not exist here.
    path: db
    parameters:
      buildpack: nodejs_buildpack
    # REGENERATE, always. Without this mbt packages whatever db/src/gen already
    # contains, and on 2026-08-24 that was a week-old schema: HDI deployed it,
    # reported SUCCEEDED, and the service then failed every read of
    # konstryx.master.ResourceNode with "invalid column name: S4MATERIAL_ID" —
    # a column added five days earlier. A stale generated artifact deploys
    # perfectly happily; it is the application that breaks, later, somewhere
    # else. The command runs from the project root because that is where
    # .cdsrc and the model live.
    build-parameters:
      builder: custom
      commands: [ "npx cds build --production" ]
    requires:
      - name: konstryx-db

resources:
  - name: konstryx-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: konstryx-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
  - name: konstryx-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  # Two halves of the same service: app-host stores the built UI, app-runtime
  # lets the approuter read it back out at request time.
  - name: konstryx-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: konstryx-html5-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
