  # Building the app is not the same as shipping it. A type: html5 module only
  # produces the artifact; this content module is what uploads it into the
  # app-host, and without it the deploy creates both repository services and
  # then puts nothing in them — the operation log says as much, "Service keys
  # defined for content deployment: { }", while the app 404s behind the login.
  - name: konstryx-ui-deployer
    type: com.sap.application.content
    path: gen
    requires:
      - name: konstryx-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      # The artifact is named after the MODULE (konstryx-ui.zip), not after its
      # build-result directory. Asking for "dist.zip" matched nothing, and the
      # copy step reported success anyway — so an empty payload was uploaded
      # and the repository answered "Could not find applications in the
      # request". target-path is relative to this module's own path (gen), so
      # the zip lands in gen/resources, which build-result then packages.
      build-result: resources
      requires:
        - name: konstryx-absence
          artifacts:
            - konstryx-absence.zip
          target-path: resources/
