_schema-version: "3.2"
ID: konstryx
version: 0.1.0
description: "KONSTRYX — SAP BTP extension for Engineering & Construction"

parameters:
  enable-parallel-deployments: true

modules:
  - name: konstryx-srv
    type: java
    path: srv
    parameters:
      buildpack: sap_java_buildpack_jakarta
      memory: 1024M
    properties:
      SPRING_PROFILES_ACTIVE: cloud,prod
      JBP_CONFIG_SAP_MACHINE_JRE: '{ jre: { version: 17.+ } }'
    build-parameters:
      builder: custom
      commands: [ "mvn clean package -DskipTests" ]
      build-result: target/*-exec.jar
    provides:
      # The approuter needs the service's route to forward to it.
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: konstryx-db
      - name: konstryx-auth
      - name: konstryx-destination

  # Entry point for the browser. Handles the XSUAA login and forwards the token
  # to the service; nothing reaches the CAP service unauthenticated.
  #
  # It routes the UI through to konstryx-srv, which already serves the SAPUI5
  # app as static content. That keeps the first deployment to one moving part.
  # Once the app is split into several task-focused apps for the launchpad, the
  # UI should move to the HTML5 application repository and be served from there
  # rather than from the Java runtime.
  - name: konstryx-approuter
    type: nodejs
    path: app/router
    parameters:
      memory: 256M
      disk-quota: 512M
    requires:
      - name: konstryx-auth
      - name: konstryx-destination
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

  - name: konstryx-db-deployer
    type: hdb
    # `cds build --production` writes the HDI artifacts to db/src/gen, not
    # gen/db — the latter is the Node.js layout and does not exist here.
    path: db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: konstryx-db

resources:
  - name: konstryx-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: konstryx-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
  - name: konstryx-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
