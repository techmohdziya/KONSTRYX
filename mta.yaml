# The Work Zone site - four spaces, their pages and tiles - is generated by
# tools/build_launchpad_site.py into launchpad-content/CommonDataModel.json and
# is NOT deployed from here yet.
#
# It needs a SAPLaunchpad service instance to deploy into, and that offering is
# not in this subaccount's marketplace: `cf marketplace` lists html5-apps-repo
# and content-agent but no launchpad at all. Work Zone is subscribed at
# subaccount level, which is a different thing from a CF service this space can
# create. Deploying with the module in place fails every other module with
# "Service plan standard not found" - which trades thirteen working apps for a
# layout that cannot be created here.
#
# To turn it on: entitle SAP Build Work Zone's launchpad service in the
# subaccount, then restore the module and resource below.
#
_schema-version: "3.2"
ID: konstryx
version: 0.1.0
description: "KONSTRYX — SAP BTP extension for Engineering & Construction"

parameters:
  enable-parallel-deployments: true

modules:
  - name: konstryx-srv
    type: java
    path: srv
    parameters:
      buildpack: sap_java_buildpack_jakarta
      memory: 1024M
    properties:
      SPRING_PROFILES_ACTIVE: cloud,prod
      JBP_CONFIG_SAP_MACHINE_JRE: '{ jre: { version: 17.+ } }'
    build-parameters:
      builder: custom
      commands: [ "mvn clean package -DskipTests" ]
      build-result: target/*-exec.jar
    provides:
      # The approuter needs the service's route to forward to it.
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: konstryx-db
      - name: konstryx-auth
      - name: konstryx-destination

  # The SAPUI5 app, built and uploaded to the HTML5 application repository.
  #
  # It is NOT served from the Java runtime. An earlier comment here claimed
  # konstryx-srv "already serves the SAPUI5 app as static content" — it never
  # did: the jar contains no UI at all (jar tf lists only service classes), so
  # the approuter's /konstryx-ui route forwarded to nothing and the deployed
  # app could not render. The repository is the right home for it and is what
  # the launchpad reads when the app is reached by intent.
  - name: konstryx-absence
    type: html5
    path: app/konstryx-absence
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npx ui5 build --clean-dest --dest dist --config ui5-deploy.yaml
      supported-platforms: []
      build-result: dist

