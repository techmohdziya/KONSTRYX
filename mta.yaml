  # What makes the apps visible to Work Zone.
  #
  # An app in the HTML5 repository is not an app Work Zone can find. Its
  # Content Manager discovers them through two subaccount destinations tagged
  # with the business service the manifests declare - one pointing at the
  # repository that holds them, one at the XSUAA that authorises them. Without
  # this module the deploy succeeds, every app is uploaded, and the Content
  # Manager shows an empty list with nothing to explain why.
  #
  # The names are not free: Work Zone looks for <service>_html_repo_host and
  # <service>_uaa, and sap.cloud.service must match the manifests exactly or
  # the destinations are ignored.
  - name: konstryx-destination-content
    type: com.sap.application.content
    requires:
      - name: konstryx-destination
        parameters:
          content-target: true
      - name: konstryx-html5-repo-host
        parameters:
          service-key:
            name: konstryx-html5-repo-host-key
      - name: konstryx-auth
        parameters:
          service-key:
            name: konstryx-auth-key
    parameters:
      content:
        instance:
          destinations:
            - Name: konstryx_html_repo_host
              ServiceInstanceName: konstryx-html5-repo-host
              ServiceKeyName: konstryx-html5-repo-host-key
              sap.cloud.service: konstryx.app
            - Name: konstryx_uaa
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: konstryx-auth
              ServiceKeyName: konstryx-auth-key
              sap.cloud.service: konstryx.app
          # Update rather than skip: a redeploy that leaves a stale destination
          # pointing at a replaced service key is how Work Zone starts
          # answering 401 for apps that deployed perfectly well.
          existing_destinations_policy: update
    build-parameters:
      no-source: true

  # Entry point for the browser. Handles the XSUAA login, serves the UI out of
  # the HTML5 repository, and forwards the token to the service; nothing
  # reaches the CAP service unauthenticated.
  - name: konstryx-approuter
    type: nodejs
    path: app/router
    parameters:
      memory: 256M
      disk-quota: 512M
    requires:
      - name: konstryx-auth
      - name: konstryx-destination
      - name: konstryx-html5-repo-runtime
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

  - name: konstryx-db-deployer
    type: hdb
    # `cds build --production` writes the HDI artifacts to db/src/gen, not
    # gen/db — the latter is the Node.js layout and does not exist here.
    path: db
    parameters:
      buildpack: nodejs_buildpack
    # REGENERATE, always. Without this mbt packages whatever db/src/gen already
    # contains, and on 2026-08-24 that was a week-old schema: HDI deployed it,
    # reported SUCCEEDED, and the service then failed every read of
    # konstryx.master.ResourceNode with "invalid column name: S4MATERIAL_ID" —
    # a column added five days earlier. A stale generated artifact deploys
    # perfectly happily; it is the application that breaks, later, somewhere
    # else.
    #
    # The `..` is load-bearing and was missing until 2026-08-25. mbt runs a
    # custom command from the MODULE directory, not the project root, so plain
    # `cds build` ran inside db/ where there is no project to build. It found
    # nothing, printed "tasks: [] ... build completed in 3 ms", and exited 0 —
    # so mbt reported the module built while packaging the same stale schema
    # this guard exists to prevent. A build step that succeeds without doing
    # anything is worse than no build step, because it reads as protection.
    #
    # If this ever needs checking: the generated files under db/src/gen carry
    # the build's timestamp. If they predate the last model change, this ran in
    # the wrong directory again.
    build-parameters:
      builder: custom
      commands: [ "npx cds build .. --production" ]
    requires:
      - name: konstryx-db

resources:
  - name: konstryx-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: konstryx-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
  - name: konstryx-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  # Two halves of the same service: app-host stores the built UI, app-runtime
  # lets the approuter read it back out at request time.
  - name: konstryx-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: konstryx-html5-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
